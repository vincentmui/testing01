[project]
name = "wellbeing"
version = "0.1.0"
description = "Is social media usage related to mental wellbeing? CRISP-DM classification study with an API and dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "joblib>=1.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.9",
    "scikit-learn>=1.5",
    "scipy>=1.17.1",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

# Standalone project: stops uv from joining a workspace in a parent folder
[tool.uv.workspace]
members = []

[dependency-groups]
dev = [
    "httpx>=0.27",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "pytest>=8",
    "seaborn>=0.13.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
